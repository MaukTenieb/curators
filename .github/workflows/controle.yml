# Check on every change: the programs run and press valid cassettes.
name: controle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programs
        run: |
          cp -r data /tmp/data
          python3 -I tools/recalcule.py /tmp/data
          python3 -I tools/cassettes.py /tmp/data "$(TZ=Europe/Paris date +%F)"
          node --check /tmp/data/kg-vhs-curations.js
          python3 -c "import json;c=json.load(open('/tmp/data/catalogue.json'));assert all(x['artist'] for x in c);print(len(c),'entries,',sum(x['fam']=='Inclassé' for x in c),'with zero genre (Pot-pourri)')"
