# Monday watch. A program (tools/veille.py) reads the curators' sources a program can read, with zero secret:
# The Lowdown on archive.org, KALX on Spinitron, the Spotify playlist of Ida B., Openwhyd.
# When the repo has the secret CLAUDE_CODE_OAUTH_TOKEN, Claude Code also reads the other sources (veille/PROMPT.md).
# Then the programs recompute the ranking and press the cassettes; each watch commits « Watch of … »
# and publishes a release with the new videos.
name: veille

on:
  schedule:
    - cron: "49 6 * * 1"   # Monday, 6:49 UTC
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Date
        id: date
        run: echo "day=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"

      - name: Harvest (program)
        run: python3 -I tools/veille.py data "${{ steps.date.outputs.day }}"

      - name: Harvest of the other sources (Claude Code, with the secret only)
        if: env.HAS_CLAUDE == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Today is ${{ steps.date.outputs.day }}. Read veille/PROMPT.md at the root of the repo and follow it, alone, without asking questions. tools/veille.py already read Adam Sigmund, Ida B. and Openwhyd today: read the other curators.
          claude_args: |
            --max-turns 300
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(python3:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"

      - name: Ranking and cassettes
        run: |
          python3 -I tools/recalcule.py data
          python3 -I tools/cassettes.py data "${{ steps.date.outputs.day }}"
          node --check data/kg-vhs-curations.js

      - name: Commit
        id: commit
        run: |
          git config user.name "Mauk Tenieb"
          git config user.email "mauktenieb@gmail.com"
          git add -A data tools
          if git diff --cached --quiet; then echo "change=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Watch of ${{ steps.date.outputs.day }}"
          git push
          echo "change=1" >> "$GITHUB_OUTPUT"

      - name: Release note
        if: steps.commit.outputs.change == '1' && hashFiles('data/derniere-veille.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "watch-${{ steps.date.outputs.day }}" \
            --title "$(head -n1 data/derniere-veille.md | sed 's/^# //')" \
            --notes-file data/derniere-veille.md
