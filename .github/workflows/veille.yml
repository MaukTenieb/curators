# Veille du lundi : Claude Code relit les sources des curateurs, ajoute les nouveautés,
# puis les programmes du dépôt recalculent le classement et pressent les cassettes.
# Chaque veille produit un commit « Veille du … » et une note de veille (release) qui liste les nouvelles vidéos.
name: veille

on:
  schedule:
    - cron: "49 6 * * 1"   # lundi, 6 h 49 UTC (8 h 49 à Paris l'été, 7 h 49 l'hiver)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Date du jour
        id: date
        run: echo "jour=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"

      - name: Moisson (Claude Code)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Nous sommes le ${{ steps.date.outputs.jour }}. Lis veille/PROMPT.md à la racine du dépôt et exécute-le en entier, seul, sans poser de question.
          claude_args: |
            --max-turns 300
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(python3:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"

      - name: Recalcul et cassettes
        run: |
          python3 -I tools/recalcule.py data
          python3 -I tools/cassettes.py data "${{ steps.date.outputs.jour }}"
          node --check data/kg-vhs-curations.js

      - name: Commit
        id: commit
        run: |
          git config user.name "Mauk Tenieb"
          git config user.email "mauktenieb@gmail.com"
          git add -A data tools
          if git diff --cached --quiet; then echo "change=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Veille du ${{ steps.date.outputs.jour }}"
          git push
          echo "change=1" >> "$GITHUB_OUTPUT"

      - name: Note de veille
        if: steps.commit.outputs.change == '1' && hashFiles('data/derniere-veille.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "veille-${{ steps.date.outputs.jour }}" \
            --title "$(head -n1 data/derniere-veille.md | sed 's/^# //')" \
            --notes-file data/derniere-veille.md
